<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ea">
  <meta name="description" content="A warm World Sunday School Day greeting for our church visitors.">
  <title>World Sunday School Day • A Blessing for You</title>
  <style>
    :root {
      --ink: #274c45;
      --green: #2f6759;
      --leaf: #76a78a;
      --softgreen: #e6f3dc;
      --cream: #fffcf4;
      --gold: #e3ad54;
      --pink: #e88b83;
      --sky: #e5f7f6;
    }
    * { box-sizing: border-box; }
    html { background: #e8f3eb; }
    body {
      margin: 0;
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 15% 8%, #fef9e8 0%, transparent 32%), linear-gradient(155deg, #dff3ef 4%, #fff7e9 58%, #e6f3dd 100%);
    }
    .page {
      position: relative;
      width: min(100%, 520px);
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(180deg, #dff5f3 0%, #f7fcf1 40%, #fff8e9 75%, #e6f2da 100%);
      box-shadow: 0 15px 65px #3b715335;
      text-align: center;
    }
    .page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 160px 160px at 105% 16%, #fff2c966, transparent), radial-gradient(ellipse 130px 180px at -10% 68%, #f9d2bf44, transparent);
      z-index: -1;
      pointer-events: none;
    }
    .bunting { width: 100%; height: 85px; position: relative; display: block; margin-top: -1px; }
    .sun { position: absolute; top: 55px; left: 20px; width: 82px; height: 82px; transform: rotate(-13deg); }
    .dove { position: absolute; top: 50px; right: 28px; width: 81px; height: 72px; transform: rotate(10deg); }
    .little-star { position:absolute; z-index:0; font-size: 20px; color: #edbb67; }
    .little-star.s1 { left: 22%; top: 132px; }
    .little-star.s2 { right: 19%; top: 139px; font-size:15px; }
    .little-star.s3 { right: 8%; top: 250px; font-size:12px; }
    .cloud { position:absolute; background: #ffffffb5; height: 15px; width: 65px; border-radius: 20px; }
    .cloud::before,.cloud::after { content:''; position:absolute; background:inherit; border-radius:100%; }
    .cloud::before { width:25px; height:25px; bottom:4px; left:9px; }
    .cloud::after { width:35px; height:35px; bottom:0; left:29px; }
    .cloud.c1 { top: 125px; left: -30px; opacity:.65; }
    .cloud.c2 { top: 188px; right: -33px; opacity:.6; }
    .heading { padding: 33px 22px 0; position:relative; }
    .heading .kicker { text-transform: uppercase; font-size: 10px; font-weight: 900; letter-spacing: .28em; color:#a36c55; margin:0 0 9px; }
    h1 { margin: 0; line-height: 1.05; letter-spacing:-.04em; font-family: Georgia, 'Times New Roman', serif; font-weight: 900; font-size: clamp(36px, 9.5vw, 51px); color: #255c52; }
    h1 .middle { display: block; font-family:'Trebuchet MS', Arial, sans-serif; font-size: .68em; letter-spacing:.03em; font-weight:900; color: #d67773; margin:7px 0 3px; }
    .heading .detail { margin: 13px 0 0; color: #678477; font-size: 13px; font-weight: 700; letter-spacing:.018em; }
    .art-line { margin: 13px auto 13px; width: 150px; height: 22px; display:block; }
    .greeting { position:relative; margin: 0 28px; padding: 27px 20px 25px; background:#fffefa; border: 2px solid #f1dec6; border-radius: 24px; box-shadow: 0 9px 0 #d6d99d42, 0 14px 28px #567d6620; }
    .greeting::before,.greeting::after { content: '✿'; position: absolute; color: #eca4a1; font-size: 18px; top: 17px; }
    .greeting::before { left:16px; }
    .greeting::after { right:16px; }
    .greeting .intro { font-size:10px; font-weight:900; letter-spacing:.24em; text-transform:uppercase; color:#aa7b54; margin: 0 0 16px; }
    .msg { margin:0; font-family: Georgia, 'Times New Roman', serif; color:#294f49; font-size:clamp(22px,5.4vw,29px); font-weight: 700; line-height:1.36; letter-spacing:-.025em; }
    .msg .blessing { display:block; font-size:1.22em; margin-top: 16px; color:#ca746b; line-height:1.19; }
    .greeting .ornament { margin:15px 0 0; color:#dcb061; font-size:17px; letter-spacing:12px; }
    .scene { position:relative; display:block; width: calc(100% - 12px); max-width: 470px; margin: 14px auto -4px; height:auto; }
    .bottom { position:relative; margin-top:0; padding: 8px 20px 24px; background: linear-gradient(180deg, #d6ebd0, #e8f2dc); font-size:11px; letter-spacing:.02em; font-weight:700; color:#527b68; }
    .bottom strong { display:block; font-size:13px; letter-spacing:.015em; color:#316a59; margin-bottom:5px; }
    .bottom .heart { color:#d78480; }
    @media (max-width: 359px) {
      .greeting {margin:0 19px; padding:24px 13px;}
      .heading{padding-top:35px;}
      .scene{margin-top:12px;}
    }
    @media (min-width: 521px) { .page { min-height: 890px; margin: 30px 0; border-radius: 32px; border:8px solid #fffdf8; } }
    @media (prefers-reduced-motion: no-preference) {
      .sun {animation: glow 5s ease-in-out infinite alternate;}
      .dove {animation: float 4s ease-in-out infinite alternate;}
      @keyframes glow {to {transform:rotate(0deg) scale(1.05)}}
      @keyframes float {to {transform: translateY(5px) rotate(6deg)}}
    }
  </style>
</head>
